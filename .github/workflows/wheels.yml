
name: Build wheels

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
  

permissions: 
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  PYTHONUNBUFFERED: "1"


jobs:
  build_wheels:
    name: Build for cp${{ matrix.python }}-${{ matrix.platform_id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux 64 bit Intel: x86_64
          - os: ubuntu-latest
            python: 313
            bitness: 64
            platform_id: manylinux_x86_64

          # Pyodide
          - os: ubuntu-latest
            python: 313
            platform_id: pyodide_wasm32
    steps:
      - uses: actions/checkout@v4

      - name: Copy to C:\
        if: ${{ runner.os == 'Windows' }}
        run: |
          Copy-Item -Path D:\a\rdkit-pypi\rdkit-pypi -Destination C:\rdkit -Recurse

      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: '3.13'
      
      - name: Export GitHub Actions cache environment variables for vcpkg
        if: ${{ runner.os == 'Windows' }}
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      
      - name: Install libraries with vcpkg
        if: ${{ runner.os == 'Windows' }}
        run: |
          cd C:\\rdkit
          vcpkg --triplet x64-windows install

      - name: Install libraries with chocolatey
        if: ${{ runner.os == 'Windows' }}
        run: |
          choco install sed
          choco install pkgconfiglite --allow-empty-checksums
        shell: pwsh

      - name: Build wheels
        env:
          CIBW_BUILD: cp${{ matrix.python }}-${{ matrix.platform_id }}

        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            cd C:\\rdkit
            echo "C:\\libs" >> $GITHUB_PATH
          fi
          python -m pip install cibuildwheel==4.2.0
          python -m cibuildwheel --output-dir wheelhouse
        shell: bash

      - uses: actions/upload-artifact@v4
        if: ${{ runner.os == 'Windows' }}
        with:
          name: cp${{ matrix.python }}-${{ matrix.platform_id }}-${{ strategy.job-index }}
          path: C:\rdkit\wheelhouse\*.whl

      - uses: actions/upload-artifact@v4
        if: ${{ runner.os != 'Windows' }}
        with:
          name: cp${{ matrix.python }}-${{ matrix.platform_id }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
      

