name: Check for new RDKit tags
on:
  schedule:
    # https://crontab.guru/every-night-at-midnight
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update_tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Get latest release tag and compare
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          current_tag=$(sed -n 's/^rdkit_tag *= *"\(.*\)".*/\1/p' setup.py | head -1)

          # Only final releases: excludes betas (Release_2026_09_1b1)
          new_tag=$(git ls-remote --tags --refs https://github.com/rdkit/rdkit 'Release_*' \
            | sed 's|.*refs/tags/||' \
            | grep -E '^Release_[0-9]{4}_[0-9]{2}_[0-9]+$' \
            | sort -V | tail -1)

          if [[ -z "$current_tag" || -z "$new_tag" ]]; then
            echo "Could not determine tags (current='$current_tag' new='$new_tag')" >&2
            exit 1
          fi

          echo "current=$current_tag new=$new_tag"

          if [[ "$new_tag" != "$current_tag" ]]; then
            sed -i "0,/rdkit_tag/ s/rdkit_tag =.*/rdkit_tag = \"$new_tag\"/g" setup.py
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "new_tag=${new_tag}" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: ${{ steps.tags.outputs.changed == 'true' }}
        uses: gr2m/create-or-update-pull-request-action@v1.x
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          title: "🤖 Bump RDKit version to ${{ steps.tags.outputs.new_tag }}"
          branch: "bump-rdkit-${{ steps.tags.outputs.new_tag }}"
          path: "./"
          commit-message: "Set RDKit version to ${{ steps.tags.outputs.new_tag }}"
          body: |
            New RDKit version tag detected in https://github.com/rdkit/rdkit.
          reviewers: kuelumbus
